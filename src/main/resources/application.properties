# Configuracion de la aplicacion - La Esquina (Avance 2: MySQL + Spring Security)

# Puerto del servidor
server.port=8080

# Nombre de la aplicacion
spring.application.name=inventario-la-esquina

# --- Conexion a MySQL ---
# Los valores se leen de variables de entorno; si no existen, se usa el valor por defecto.
# La contrasena real de MySQL NUNCA se escribe aqui: se define en DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/laesquina?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# update: crea las tablas en el primer arranque y las conserva (con sus datos) en los siguientes.
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate (util para las pruebas y la sustentacion).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Cada peticion abre y cierra su propia sesion con la BD en la capa de servicio.
spring.jpa.open-in-view=false

# --- Usuarios de prueba (los crea DataInitializer solo si la tabla usuario esta vacia) ---
# Contrasenas de PRUEBA documentadas en el README. Se guardan cifradas con BCrypt.
app.usuarios.admin.username=admin
app.usuarios.admin.password=${ADMIN_PASSWORD:Admin2026!}
app.usuarios.operador.username=operador
app.usuarios.operador.password=${OPERADOR_PASSWORD:Operador2026!}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# --- Asistente con IA (etapa posterior al Avance 2) ---
# La API key se leera de la variable de entorno OPENAI_API_KEY. NUNCA en el codigo.
# openai.api.key=${OPENAI_API_KEY:}

# --- Asistente con IA (Groq) ---  $env:GROQ_API_KEY = 'tu_key_aqui'
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.modelo=openai/gpt-oss-20b