# Perfil "test": las pruebas automaticas usan H2 en memoria (modo MySQL),
# para no tocar la base de datos real ni depender de que MySQL este encendido.
spring.datasource.url=jdbc:h2:mem:laesquina_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
