<div class="pantalla-login">
  <div class="tarjeta-login">

    <!-- Columna del formulario -->
    <div class="col-form">
      <h2>🛒 La Esquina</h2>
      <p class="subtitulo">Bienvenido de nuevo — ingresa para continuar</p>

      <form (ngSubmit)="ingresar()">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" [(ngModel)]="usuario" required autofocus />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required />

        @if (error) {
        <p class="mensaje-error">{{ error }}</p>
        }

        <button type="submit" [disabled]="cargando">
          {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
        </button>
      </form>
    </div>

    <!-- Columna decorativa -->
    <div class="col-ilustracion">
      <div class="sol"></div>
      <div class="monte monte-3"></div>
      <div class="monte monte-2"></div>
      <div class="monte monte-1"></div>
      <p class="frase">Gestiona tu inventario<br>desde un solo lugar.</p>
    </div>

  </div>
</div>
